services:
  db:
    image: mysql:8.0.28
    container_name: pma_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: YOUR-PASSWORD-HERE
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pma_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma_app
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: YOUR-PASSWORD-HERE
    networks:
      - pma_net

  webserver_pma:
    image: nginx:stable-alpine
    container_name: pma_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./pma.conf:/etc/nginx/conf.d/default.conf
      - ./.htpasswd:/etc/nginx/.htpasswd
    depends_on:
      - phpmyadmin
    networks:
      - pma_net

networks:
  pma_net:

volumes:
  dbdata:
